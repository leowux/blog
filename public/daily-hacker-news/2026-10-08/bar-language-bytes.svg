<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">五种非 Go 语言的字节数</title><desc id="desc">Shell 58,215 字节；JavaScript 46,940 字节；HTML 37,560 字节；CSS 34,266 字节；Dockerfile 4,488 字节。横轴从零起，单位为字节。</desc><rect width="960" height="530" rx="18" fill="#fafcfb"/><g font-family="system-ui, -apple-system, Segoe UI, Noto Sans CJK SC, sans-serif"><text x="38" y="47" font-size="25" fill="#182c37" text-anchor="start" font-weight="700">五种非 Go 语言的字节数</text><text x="38" y="79" font-size="15" fill="#485f6a" text-anchor="start" font-weight="400">即时快照 · 排除 Go 以看清较小分类 · 线性刻度，k = 1,000 字节</text><line x1="168.0" y1="112" x2="168.0" y2="415" stroke="#dbe4e7"/><text x="168.0" y="439" font-size="14" fill="#485f6a" text-anchor="middle" font-weight="400">0k</text><line x1="264.6666666666667" y1="112" x2="264.6666666666667" y2="415" stroke="#dbe4e7"/><text x="264.6666666666667" y="439" font-size="14" fill="#485f6a" text-anchor="middle" font-weight="400">10k</text><line x1="361.33333333333337" y1="112" x2="361.33333333333337" y2="415" stroke="#dbe4e7"/><text x="361.33333333333337" y="439" font-size="14" fill="#485f6a" text-anchor="middle" font-weight="400">20k</text><line x1="458.0" y1="112" x2="458.0" y2="415" stroke="#dbe4e7"/><text x="458.0" y="439" font-size="14" fill="#485f6a" text-anchor="middle" font-weight="400">30k</text><line x1="554.6666666666667" y1="112" x2="554.6666666666667" y2="415" stroke="#dbe4e7"/><text x="554.6666666666667" y="439" font-size="14" fill="#485f6a" text-anchor="middle" font-weight="400">40k</text><line x1="651.3333333333333" y1="112" x2="651.3333333333333" y2="415" stroke="#dbe4e7"/><text x="651.3333333333333" y="439" font-size="14" fill="#485f6a" text-anchor="middle" font-weight="400">50k</text><line x1="748.0" y1="112" x2="748.0" y2="415" stroke="#dbe4e7"/><text x="748.0" y="439" font-size="14" fill="#485f6a" text-anchor="middle" font-weight="400">60k</text><text x="150" y="1