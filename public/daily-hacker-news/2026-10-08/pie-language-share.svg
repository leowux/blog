<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">同一字节总量中的 Go 占比</title><desc id="desc">Go 21,237,526 字节，99.153%；其他五种语言合计 181,469 字节，0.847%。两者互斥且穷尽分母 21,418,995 字节。</desc><rect width="960" height="530" rx="18" fill="#fafcfb"/><g font-family="system-ui, -apple-system, Segoe UI, Noto Sans CJK SC, sans-serif"><text x="38" y="47" font-size="25" fill="#182c37" text-anchor="start" font-weight="700">同一字节总量中的 Go 占比</text><text x="38" y="79" font-size="15" fill="#485f6a" text-anchor="start" font-weight="400">即时快照 · 两个互斥分类 · 与柱状图来自同一完整语言快照</text><circle cx="254" cy="278" r="153" fill="#bd581c"/><path d="M 254 278 L 254.0 125.0 A 153 153 0 1 1 245.85915435465662 125.21673314076997 Z" fill="#007f78"/><rect x="464" y="185" width="18" height="18" rx="3" fill="#007f78"/><text x="496" y="202" font-size="20" fill="#182c37" text-anchor="start" font-weight="700">Go</text><text x="496" y="234" font-size="21" fill="#007f78" text-anchor="start" font-weight="400">99.153% · 21,237,526 字节</text><rect x="464" y="292" width="18" height="18" rx="3" fill="#bd581c"/><text x="496" y="309" font-size="20" fill="#182c37" text-anchor="start" font-weight="700">其他五种语言</text><text x="496" y="341" font-size="21" fill="#bd581c" text-anchor="start" font-weight="400">0.847% · 181,469 字节</text><text x="464" y="398" font-size="15" fill="#485f6a" text-anchor="start" font-weight="400">其他 = Shell + JavaScript + HTML</text><text x="464" y="422" font-size="15" fill="#485f6a" text-anchor="start" font-weight="400">             + CSS + Dockerfile</text><text x="38" y="481" font-size="14" fill="#485f6a" text-anchor="start" font-weight="400">分母 = API 返回的全部语言字节之和：21,418,995；百分比四舍五入至 3 位小数。</text><text x="38" y="507" font-size="14" fill="#485f6a" text-anchor="start" font-weight="400">来源：GitHub REST API · docker/docker-agent · 数据与方法见附表</text></g></svg>