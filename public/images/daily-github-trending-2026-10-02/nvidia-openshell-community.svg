<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">OpenShell 近七日公开新建协作条目构成</title>
  <desc id="desc">2026 年 9 月 26 日至 10 月 2 日的 GitHub 搜索 API 显示，公开新建 Issue 130 个，占 40.4%；公开新建 Pull request 192 个，占 59.6%。</desc>
  <rect width="720" height="360" rx="16" fill="#f8fafc"/>
  <text x="54" y="42" fill="#0f172a" font-family="system-ui, sans-serif" font-size="20" font-weight="700">公开新建协作条目构成</text>
  <circle cx="248" cy="190" r="104" fill="none" stroke="#e2e8f0" stroke-width="54"/>
  <circle cx="248" cy="190" r="104" fill="none" stroke="#8b5cf6" stroke-width="54" stroke-dasharray="389.4 264" stroke-dashoffset="0" transform="rotate(-90 248 190)"/>
  <circle cx="248" cy="190" r="104" fill="none" stroke="#0ea5e9" stroke-width="54" stroke-dasharray="264 389.4" stroke-dashoffset="-389.4" transform="rotate(-90 248 190)"/>
  <text x="248" y="184" text-anchor="middle" fill="#0f172a" font-family="system-ui, sans-serif" font-size="28" font-weight="700">322</text>
  <text x="248" y="208" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="14">公开新建条目</text>
  <rect x="438" y="128" width="16" height="16" rx="3" fill="#0ea5e9"/><text x="464" y="142" fill="#0f172a" font-family="system-ui, sans-serif" font-size="17">Issue：130（40.4%）</text>
  <rect x="438" y="182" width="16" height="16" rx="3" fill="#8b5cf6"/><text x="464" y="196" fill="#0f172a" font-family="system-ui, sans-serif" font-size="17">Pull request：192（59.6%）</text>
  <text x="666" y="318" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">窗口：2026-09-26..2026-10-02 UTC</text>
