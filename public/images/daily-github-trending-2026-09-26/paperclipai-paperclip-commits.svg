<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">paperclipai/paperclip 近期非合并、非机器人提交数</title>
  <desc id="desc">2026 年 9 月 19 日至 26 日 09:03 UTC 的提交数依次为二十二、四、十九、二十六、二十一、十二、十、六。</desc>
  <rect width="800" height="450" fill="#f8fafc"/>
  <text x="64" y="45" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700">默认分支近期提交（UTC）</text>
  <text x="64" y="72" fill="#64748b" font-family="Arial, sans-serif" font-size="15">按 commit.author.date 分日；排除多父 merge 与以 [bot] 结尾的账号</text>
  <path d="M90 350H746M90 250H746M90 150H746M90 50H746" stroke="#cbd5e1" stroke-width="1"/>
  <path d="M90 50V350H746" fill="none" stroke="#64748b" stroke-width="2"/>
