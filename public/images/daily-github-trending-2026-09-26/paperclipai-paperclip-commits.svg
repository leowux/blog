  <g fill="#0284c7"><rect x="110" y="130" width="48" height="220" rx="5"/><rect x="190" y="310" width="48" height="40" rx="5"/><rect x="270" y="160" width="48" height="190" rx="5"/><rect x="350" y="90" width="48" height="260" rx="5"/><rect x="430" y="140" width="48" height="210" rx="5"/><rect x="510" y="230" width="48" height="120" rx="5"/><rect x="590" y="250" width="48" height="100" rx="5"/><rect x="670" y="290" width="48" height="60" rx="5"/></g>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="17" font-weight="700"><text x="120" y="119">22</text><text x="206" y="299">4</text><text x="280" y="149">19</text><text x="360" y="79">26</text><text x="440" y="129">21</text><text x="520" y="219">12</text><text x="600" y="239">10</text><text x="686" y="279">6</text></g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="14"><text x="105" y="380">09-19</text><text x="185" y="380">09-20</text><text x="265" y="380">09-21</text><text x="345" y="380">09-22</text><text x="425" y="380">09-23</text><text x="505" y="380">09-24</text><text x="585" y="380">09-25</text><text x="665" y="380">09-26*</text></g>
