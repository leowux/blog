<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">2026 年 9 月 4 日至 11 日 UTC 非合并提交数</title>
  <desc id="desc">GitHub commits API 在该窗口返回零条记录；图中八个日期均标为零，未将零记录解释为整个仓库停止开发。</desc>
  <rect width="960" height="360" fill="#fafafa"/>
  <rect x="32" y="30" width="896" height="286" rx="12" fill="#fff" stroke="#d1d5db"/>
  <text x="70" y="73" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1f2937">默认分支 commits API 返回值（UTC）</text>
  <path d="M105 260H880M105 102V260" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g fill="#e5e7eb"><rect x="137" y="256" width="46" height="4" rx="2"/><rect x="231" y="256" width="46" height="4" rx="2"/><rect x="325" y="256" width="46" height="4" rx="2"/><rect x="419" y="256" width="46" height="4" rx="2"/><rect x="513" y="256" width="46" height="4" rx="2"/><rect x="607" y="256" width="46" height="4" rx="2"/><rect x="701" y="256" width="46" height="4" rx="2"/><rect x="795" y="256" width="46" height="4" rx="2"/></g>
    <g font-size="16" font-weight="700" fill="#374151"><text x="160" y="246">0</text><text x="254" y="246">0</text><text x="348" y="246">0</text><text x="442" y="246">0</text><text x="536" y="246">0</text><text x="630" y="246">0</text><text x="724" y="246">0</text><text x="818" y="246">0</text></g>
    <g font-size="13" fill="#6b7280"><text x="160" y="286">09-04</text><text x="254" y="286">09-05</text><text x="348" y="286">09-06</text><text x="442" y="286">09-07</text><text x="536" y="286">09-08</text><text x="630" y="286">09-09</text><text x="724" y="286">09-10</text><text x="818" y="286">09-11</text></g>
  </g>
  <text x="105" y="324" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">零记录仅表示这次 API 查询的结果；不据此判断代码质量、全分支活动或项目是否维护。</text>
</svg>
