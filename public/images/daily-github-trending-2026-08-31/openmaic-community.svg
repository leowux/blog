<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">OpenMAIC 近期公开协作条目构成</title>
  <desc id="desc">近期更新的 100 个公开协作条目中，73 个是 Pull request，27 个是 Issue。</desc>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="56" y="34" fill="#171717" font-family="Arial, sans-serif" font-size="20" font-weight="700">近期公开协作条目构成</text>
  <text x="56" y="58" fill="#666666" font-family="Arial, sans-serif" font-size="13">Issues API 按更新时间排序的第一页（100 条）</text>
  <circle cx="245" cy="198" r="112" fill="none" stroke="#e5e7eb" stroke-width="48"/>
  <circle cx="245" cy="198" r="112" fill="none" stroke="#7c3aed" stroke-width="48" stroke-dasharray="513.6 703.7" stroke-dashoffset="0" transform="rotate(-90 245 198)"/>
  <circle cx="245" cy="198" r="112" fill="none" stroke="#f59e0b" stroke-width="48" stroke-dasharray="190.1 703.7" stroke-dashoffset="-513.6" transform="rotate(-90 245 198)"/>
  <text x="245" y="192" fill="#171717" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">100</text>
  <text x="245" y="218" fill="#666666" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">近期条目</text>
  <g font-family="Arial, sans-serif">
    <rect x="455" y="132" width="18" height="18" rx="3" fill="#7c3aed"/>
    <text x="486" y="147" fill="#171717" font-size="17" font-weight="700">Pull request　73（73%）</text>
    <text x="486" y="170" fill="#666666" font-size="13">含 pull_request 字段的返回条目</text>
    <rect x="455" y="218" width="18" height="18" rx="3" fill="#f59e0b"/>
    <text x="486" y="233" fill="#171717" font-size="17" font-weight="700">Issue　27（27%）</text>
    <text x="486" y="256" fill="#666666" font-size="13">未含 pull_request 字段的返回条目</text>
  </g>
</svg>
