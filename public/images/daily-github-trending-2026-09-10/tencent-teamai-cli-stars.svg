<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Tencent teamai-cli 公开 Star 事件样本折线图</title>
  <desc id="desc">最近 100 条公开仓库事件中 71 条为 WatchEvent。按 UTC 小时的样本数为 07 时 15 条、08 时 52 条、09 时 4 条。</desc>
  <rect width="760" height="360" fill="#0f172a" rx="18"/>
  <text x="48" y="58" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">公开 Star 事件样本（UTC）</text>
  <text x="48" y="86" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">最近 100 条公开事件中的 WatchEvent；不是全天或长期趋势</text>
  <g stroke="#334155" stroke-width="1">
    <line x1="92" y1="290" x2="710" y2="290"/><line x1="92" y1="225" x2="710" y2="225"/><line x1="92" y1="160" x2="710" y2="160"/><line x1="92" y1="95" x2="710" y2="95"/>
  </g>
  <g fill="#94a3b8" font-family="Arial, sans-serif" font-size="13"><text x="61" y="294">0</text><text x="54" y="229">20</text><text x="54" y="164">40</text><text x="54" y="99">60</text></g>
  <path d="M160 241 L400 121 L640 277" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fbbf24" stroke="#0f172a" stroke-width="4"><circle cx="160" cy="241" r="8"/><circle cx="400" cy="121" r="8"/><circle cx="640" cy="277" r="8"/></g>
  <g fill="#e2e8f0" font-family="Arial, sans-serif" font-size="15" text-anchor="middle"><text x="160" y="323">09-10 07:00</text><text x="400" y="323">09-10 08:00</text><text x="640" y="323">09-10 09:00</text></g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><text x="160" y="226">15</text><text x="400" y="106">52</text><text x="640" y="262">4</text></g>
</svg>
