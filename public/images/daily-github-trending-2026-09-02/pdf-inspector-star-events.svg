<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">pdf-inspector 公开 Star 事件样本趋势</title>
  <desc id="desc">2026 年 9 月 2 日 UTC 的四个小时窗口，公开 WatchEvent 数依次为 8、26、28、33。</desc>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="56" y="34" fill="#171717" font-family="Arial, sans-serif" font-size="20" font-weight="700">公开 Star 事件样本（小时窗口，UTC）</text>
  <text x="56" y="58" fill="#666666" font-family="Arial, sans-serif" font-size="13">GitHub Events API 最近 100 条事件中的 95 条 WatchEvent</text>
  <g stroke="#e5e5e5" stroke-width="1"><line x1="64" y1="92" x2="720" y2="92"/><line x1="64" y1="145" x2="720" y2="145"/><line x1="64" y1="198" x2="720" y2="198"/><line x1="64" y1="251" x2="720" y2="251"/><line x1="64" y1="304" x2="720" y2="304"/></g>
  <g fill="#666666" font-family="Arial, sans-serif" font-size="12" text-anchor="end"><text x="54" y="96">36</text><text x="54" y="149">27</text><text x="54" y="202">18</text><text x="54" y="255">9</text><text x="54" y="308">0</text></g>
  <path d="M64 257 L283 151 L501 139 L720 110" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2563eb" stroke="#ffffff" stroke-width="3"><circle cx="64" cy="257" r="6"/><circle cx="283" cy="151" r="6"/><circle cx="501" cy="139" r="6"/><circle cx="720" cy="110" r="6"/></g>
  <g fill="#1d4ed8" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle"><text x="64" y="243">8</text><text x="283" y="137">26</text><text x="501" y="125">28</text><text x="720" y="96">33</text></g>
  <g fill="#666666" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"><text x="64" y="330">05:00</text><text x="283" y="330">06:00</text><text x="501" y="330">07:00</text><text x="720" y="330">08:00</text></g>
